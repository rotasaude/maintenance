"""
Uma cidade. Só este tipo alcança o banco da cidade, e só por city(slug:).
"""
type City {
  accounts: [CityAccount!]!
  alertRecipients: [AlertRecipient!]!
  channel: CityChannel
  consentTermVersion: String
  counts: CityCounts
  createdAt: ISO8601DateTime!
