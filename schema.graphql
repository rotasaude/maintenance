"""
Metadado de um token de serviço. O segredo NUNCA aparece aqui.
"""
type MaintenanceToken {
  access: String!
  citySlugs: [String!]!
  expiresAt: ISO8601DateTime!
  id: ID!
  lastUsedAt: ISO8601DateTime
  maintainerId: ID!
  name: String!
  revokedAt: ISO8601DateTime
}

"""
Escritas da API de manutenção
"""
type Mutation {
  """
  Ativa uma versão publicada como a vigente da cidade. Exige duas assinaturas de
  ativação de revisores da cidade e o TOTP do momento.
  """
  activateProtocol(
    citySlug: String!

    """
    TOTP do momento
    """
    code: String!
    name: String!
    version: Int!
  ): ActivateProtocolPayload

  """
  Cria um token de serviço. O segredo volta UMA vez, em secretOnce.
  """
  createMaintenanceToken(
    access: String!
    citySlugs: [String!] = []

    """
    TOTP do momento: um token é um login que não expira em 8h
    """
    code: String!
    expiresAt: ISO8601DateTime!
    name: String!
  ): CreateMaintenanceTokenPayload

  """
  Desativa um mantenedor, encerrando sessões e tokens na hora
  """
  deactivateMaintainer(id: ID!): DeactivateMaintainerPayload

  """
  Convida um mantenedor. O token do convite NUNCA volta na resposta.
  """
  inviteMaintainer(
    """
    TOTP do momento: convidar zera senha, TOTP e sessões
    """
    code: String!
    emailAddress: String!
  ): InviteMaintainerPayload

  """
  Publica uma versão em revisão. Exige duas assinaturas de revisores da cidade que não a editaram, e o TOTP do momento.
  """
  publishProtocol(
    citySlug: String!

    """
    TOTP do momento
    """
    code: String!
    name: String!
    version: Int!
  ): PublishProtocolPayload

  """
  Aposenta uma versão de protocolo. A versão active da cidade nunca é aposentada (R4). Exige o TOTP do momento.
  """
  retireProtocol(
    citySlug: String!

    """
    TOTP do momento
    """
    code: String!
    name: String!
    version: Int!
  ): RetireProtocolPayload

  """
  Reversão de emergência: volta a ativação da cidade para a versão anterior
  assinada, com motivo. Exige o TOTP do momento; o motivo fica na cidade, nunca
  na auditoria da plataforma.
  """
  revertProtocolActivation(
    citySlug: String!

    """
    TOTP do momento
    """
    code: String!
    name: String!
    reason: String!
  ): RevertProtocolActivationPayload

  """
  Revoga um token de serviço na hora
  """
  revokeMaintenanceToken(id: ID!): RevokeMaintenanceTokenPayload

  """
  Salva uma versão de protocolo em rascunho numa cidade. O mantenedor passa a
  constar como quem editou a versão, e quem edita nunca a assina.
  """
  saveProtocolDraft(citySlug: String!, definition: JSON!): SaveProtocolDraftPayload

  """
  Envia um rascunho para revisão: a partir daqui revisores da cidade podem assinar.
  """
  submitProtocolForReview(citySlug: String!, name: String!, version: Int!): SubmitProtocolForReviewPayload
}

