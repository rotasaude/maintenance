"""
Uma conta da API de manutenção
"""
type Maintainer {
  """
  Falso depois de desativado
  """
  active: Boolean!
  createdAt: ISO8601DateTime!
  emailAddress: String!

  """
  Senha e TOTP definidos pelo convite
